<!DOCTYPE html>
<html lang="en,th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <link href="https://fonts.googleapis.com/css2?family=Trirong:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Trirong' , sans-serif;
            margin: 10;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column; /* Added to stack elements vertically */
        }
        .logo {
            margin-bottom: 20px; /* Space between logo and header */
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(31, 96, 170, 0.1);
            width: 300px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #1F60AA;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .signup-container {
            display: none; /* Hidden by default */
        }
        .switch-link {
            text-align: center;
            margin-top: 10px;
            color: #1F60AA;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
    
    <h1>ยินดีต้อนรับสู่ วัยใสใส่ใจรัก</h1> <!-- Highlighted welcome message -->
    <div class="logo">
        <img src="น้อนใส่ใจ/น้อนใส่ใจ-โลโก้.png" alt="Logo" width="300"> <!-- Highlighted logo -->
    </div>
    </style>
</head>
<body>

<div class="login-container">
    <h1 style="font-family: 'Trirong', sans-serif; color: #1F60AA; ">Login</h1>
    <h3 style="font-family: 'TH Sarabun PSK', sans-serif; color: #000000; font-size: 16px;">กรุณาเข้าสู่ระบบเพื่อใช้งาน</h3>
    <form id="loginForm">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit"><b>Login</b></button>
    </form>
    <div class="switch-link" onclick="showSignup()">Don't have an account? Sign up</div>
</div>

<div class="signup-container">
    <div class="login-container">
        <h1 style="font-family: 'Trirong', sans-serif; color: #1F60AA; ">Sign Up </h1>
        <h3 style="font-family: 'Trirong', sans-serif; color: #000000; font-size: 16px;">กรุณาสมัครสมาชิก</h3>
        <form id="signupForm">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit"><b>Sign Up</b></button>
        </form>
        <div class="switch-link" onclick="showLogin()">Already have an account? Login</div>
    </div>
</div>

<script>
function showSignup() {
    document.querySelector('.login-container').style.display = 'none';
    document.querySelector('.signup-container').style.display = 'block';
}

function showLogin() {
    document.querySelector('.signup-container').style.display = 'none';
    document.querySelector('.login-container').style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = this.querySelector('input[type="email"]').value;
    const password = this.querySelector('input[type="password"]').value;
    try {
        const response = await fetch('/login', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email, password })
});

const data = await response.json();

if (response.ok) {
  window.location.href = '/homepage';
}

    } catch (error) {
        alert('Error connecting to server');
    }
});

document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = this.querySelector('input[type="email"]').value;
    const password = this.querySelector('input[type="password"]').value;
    const confirmPassword = this.querySelectorAll('input[type="password"]')[1].value;
    if (password !== confirmPassword) {
        alert('Passwords do not match.');
        return;
    }
    try {
  const response = await fetch('/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });

  const data = await response.json();

  if (response.ok) {
    alert(data.message);
    showLogin();
  } else {
    alert(data.message);
  }
} catch (err) {
  alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
}

});
</script>


</body>
</html>
